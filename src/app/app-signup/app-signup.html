<main class="signup-wrapper">
  <form class="signup-card" (ngSubmit)="createAccount()">
    <span class="auth-mark"><mat-icon>person_add</mat-icon></span>
    <span class="auth-eyebrow">COMECE POR AQUI</span>
    <h1>Crie sua conta</h1>
    <p class="signup-subtitle">Tenha seus chamados e conversas organizados em um só lugar.</p>
    <div class="input-group"><label for="name">Nome completo</label><input id="name" name="name" [(ngModel)]="name" placeholder="Como podemos te chamar?" autocomplete="name" required></div>
    <div class="input-group"><label for="email">E-mail</label><input id="email" type="email" name="email" [(ngModel)]="email" placeholder="voce@exemplo.com" autocomplete="email" required></div>
    <div class="input-group"><label for="password">Senha</label><input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" required></div>
    <div class="input-group"><label for="confirmPassword">Confirmar senha</label><input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Digite a senha novamente" autocomplete="new-password" required></div>
    <div class="role-options"><span>Tipo de conta</span><label><input type="radio" name="role" [(ngModel)]="role" value="user"><span><strong>Cliente</strong><small>Acompanhar meus chamados</small></span></label><label><input type="radio" name="role" [(ngModel)]="role" value="technician"><span><strong>Técnico</strong><small>Atender solicitações</small></span></label></div>
    <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    <button class="btn-submit" type="submit">Criar minha conta <mat-icon>arrow_forward</mat-icon></button>
    <p class="signup-footer">Já tem uma conta? <a routerLink="/login">Entrar</a></p>
  </form>
</main>
