<main class="register-wrapper">
  <form class="register-card" (ngSubmit)="sendComplaint()">
    <a class="back-link" routerLink="/users"><mat-icon>arrow_back</mat-icon> Voltar para meus chamados</a>
    <span class="auth-mark"><mat-icon>handyman</mat-icon></span>
    <span class="auth-eyebrow">ESTAMOS AQUI PARA AJUDAR</span>
    <h1>Abra um chamado</h1>
    <p class="register-subtitle">Conte o que está acontecendo. Um técnico vai acompanhar sua solicitação.</p>
    <div class="input-group"><label for="name">Seu nome</label><input id="name" name="name" [(ngModel)]="name" placeholder="Nome completo" autocomplete="name" required></div>
    <div class="input-group"><label for="email">E-mail para contato</label><input id="email" name="email" type="email" [(ngModel)]="email" placeholder="voce@exemplo.com" autocomplete="email" required></div>
    <div class="input-group"><label for="subject">Qual é o problema?</label><input id="subject" name="subject" [(ngModel)]="subject" placeholder="Ex.: Computador não liga" required></div>
    <div class="input-group"><label for="description">Descreva com mais detalhes</label><textarea id="description" name="description" [(ngModel)]="description" placeholder="O que aconteceu? Quando começou?" rows="4" required></textarea></div>
    <p class="form-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    <button class="btn-submit-ticket" type="submit"><mat-icon>send</mat-icon> Enviar solicitação</button>
    <p class="privacy-note"><mat-icon>lock</mat-icon> Seus dados são usados apenas para este atendimento.</p>
  </form>
</main>
